<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>便10 2D の窓の重さ</title></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
// 使い捨て（便10）: 2D の窓のシェーダーを、今と案で同じ大きさに描かせて GPU の時間を比べる（本体は変えない）。
// 大きさは iPhone の「ふつう」の 2D の天井（402×874 の 1.75倍＝703×1529）。前と後を 20 こまずつ ABBA の順で交互に描き、塊ごとの中央値の比を見る
import * as RG from '/src/shaders/rainGlass.js'
import * as WS from '/src/shaders/windowSea.js'
import * as WM from '/src/shaders/windowMountains.js'
import rainDusk from '/src/data/scenes/summer-rain-dusk.js'
import seaside from '/src/data/scenes/summer-dusk-seaside.js'
import mountains from '/src/data/scenes/summer-morning-mountains.js'

const W = 703, H = 1529
const cv = document.getElementById('c'); cv.width = W; cv.height = H
const gl = cv.getContext('webgl2', { antialias: false, alpha: false })
const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2')
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)

function build(mod, variant) {
  history.replaceState(null, '', location.pathname + '?b10=' + variant)
  const fsSrc = mod.buildFragment('standard')
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh }
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, mod.vertexSource)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsSrc)); gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p))
  return p
}
let bgTex = null, bgAsp = 1
async function loadBg(url) {
  const img = new Image(); img.src = url; await img.decode(); bgAsp = img.naturalWidth / img.naturalHeight
  bgTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, bgTex)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img)
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D, k, v)
}
function draw(p, scene, t, intensity) {
  gl.useProgram(p)
  const a = gl.getAttribLocation(p, 'aPosition'); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0)
  const u = (n) => gl.getUniformLocation(p, n)
  gl.uniform2f(u('uResolution'), W, H); gl.uniform1f(u('uTime'), t); gl.uniform1f(u('uIntensity'), intensity); gl.uniform1f(u('uBright'), 1)
  const pal = scene.palette.early
  gl.uniform3fv(u('uSkyTop'), hex(pal.skyTop)); gl.uniform3fv(u('uSkyMid'), hex(pal.skyMid)); gl.uniform3fv(u('uHorizon'), hex(pal.horizon)); gl.uniform3fv(u('uSunGlow'), hex(pal.sunGlow)); gl.uniform3fv(u('uDropTint'), hex(pal.dropTint))
  if (u('uBg')) { gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bgTex); gl.uniform1i(u('uBg'), 2); gl.uniform1f(u('uHasBg'), 1); gl.uniform1f(u('uBgAspect'), bgAsp) }
  gl.drawArrays(gl.TRIANGLES, 0, 3)
}
const sleepGpu = () => new Promise((r) => setTimeout(r, 30))
async function timeBatch(p, scene, intensity, n) {
  const qs = []
  for (let i = 0; i < n; i++) { const q = gl.createQuery(); gl.beginQuery(ext.TIME_ELAPSED_EXT, q); draw(p, scene, 10 + i * 0.033, intensity); gl.endQuery(ext.TIME_ELAPSED_EXT); qs.push(q) }
  gl.finish()
  for (let k = 0; k < 200; k++) { if (gl.getQueryParameter(qs[qs.length - 1], gl.QUERY_RESULT_AVAILABLE)) break; await sleepGpu() }
  if (gl.getParameter(ext.GPU_DISJOINT_EXT)) return null
  const ms = qs.map((q) => gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6); qs.forEach((q) => gl.deleteQuery(q))
  ms.sort((a, b) => a - b); return ms[ms.length >> 1]
}
const med = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1] }
window.__run = async (jobs, rounds = 10) => {
  await loadBg('/seasons/bg/summer-rain-dusk-b.jpg')
  const out = {}
  for (const [name, modName, variant, sceneName, inten] of jobs) {
    const mod = { RG, WS, WM }[modName], scene = { rainDusk, seaside, mountains }[sceneName]
    const pA = build(mod, ''), pB = build(mod, variant)
    for (let w = 0; w < 3; w++) { await timeBatch(pA, scene, inten, 20); await timeBatch(pB, scene, inten, 20) } // 慣らし
    const A = [], B = [], R = []
    for (let r = 0; r < rounds; r++) {
      const a1 = await timeBatch(pA, scene, inten, 20), b1 = await timeBatch(pB, scene, inten, 20), b2 = await timeBatch(pB, scene, inten, 20), a2 = await timeBatch(pA, scene, inten, 20)
      if ([a1, b1, b2, a2].some((v) => v == null)) continue
      A.push(a1, a2); B.push(b1, b2); R.push((b1 + b2) / (a1 + a2))
    }
    out[name] = { ima: +med(A).toFixed(3), an: +med(B).toFixed(3), ratio: +med(R).toFixed(3), rmin: +Math.min(...R).toFixed(3), rmax: +Math.max(...R).toFixed(3), rounds: R.length }
  }
  return { gpu: (() => { const d = gl.getExtension('WEBGL_debug_renderer_info'); return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : '?' })(), size: [W, H], timer: !!ext, ...out }
}
window.__ready = true
</script>
</body></html>
